name = "loviedowpie-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# KV namespace id is filled in after `wrangler kv namespace create STORE`.
[[kv_namespaces]]
binding = "STORE"
id = "0c3abe9badbb487e9c790478c1d4d27b"

# Secret (never committed): FCM_SERVICE_ACCOUNT = Firebase service-account JSON, set with
#   wrangler secret put FCM_SERVICE_ACCOUNT

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]
